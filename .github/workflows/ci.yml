name: Build

# Run only when Rust / fixtures / this workflow change. Docs-only pushes skip the matrix.
# Markdown under matching trees is excluded with `!**/*.md` (GitHub forbids pairing `paths`
# with `paths-ignore` on the same event — use `!` negation instead).
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "examples/**"
      - "benches/**"
      - "contrib/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "examples/**"
      - "benches/**"
      - "contrib/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.os }}"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  fixtures:
    name: Verify golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-ubuntu-latest"

      - name: Build tes
        run: cargo build --bin tes

      # Exits 1 on any corrupt fixture; --deep also decodes every payload.
      - name: tes verify golden fixtures
        run: ./target/debug/tes verify --deep fixtures/v0/*.tes

      - name: tes verify conformance accept
        run: ./target/debug/tes verify --deep fixtures/conformance/accept/*.tes

      - name: tes verify conformance reject (must fail)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          for f in fixtures/conformance/reject/*.tes; do
            if ./target/debug/tes verify --deep "$f"; then
              echo "expected reject, but deep verify succeeded: $f" >&2
              failed=1
            else
              echo "ok reject: $f"
            fi
          done
          exit "$failed"

      - name: Identify .tes via file(1) magic
        run: |
          out=$(file -m contrib/magic/tessera fixtures/v0/note_one_chunk.tes)
          echo "$out"
          echo "$out" | grep -qi 'Tessera'
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-ubuntu-latest"

      - name: Check MSRV
        run: cargo check --all-targets
