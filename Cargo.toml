[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Open document format (.tes): mmap-friendly chunked binary for notes, wikis, manuscripts, and slides — AI-friendly text exports, tes CLI — Rust crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/tessera"
readme = "README.md"
keywords = []
categories = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "tes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
memmap2 = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.23.2", features = ["v4"] }
zstd = "0.13.3"

[dev-dependencies]
anyhow = "1.0.102"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
