[package]
name = "tessera-doc"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Open document format (.tes): mmap-friendly chunked binary for notes, wikis, manuscripts, and slides — AI-friendly text exports, tes CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/tessera"
readme = "README.md"
keywords = ["document-format", "binary-format", "notes", "markdown", "citation"]
categories = [
    "encoding",
    "text-processing",
    "command-line-utilities",
    "parser-implementations",
    "data-structures",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tes"
path = "src/main.rs"

[dependencies]
argus-chunk = "0.1.0"
clap = { version = "4.6.4", features = ["derive"] }
memmap2 = "0.9.11"
pulldown-cmark = "0.13.4"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting"] }
uuid = { version = "1.24.0", features = ["v4"] }

[patch.crates-io]
# argus-chunk = { path = "../argus-chunk" }

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
