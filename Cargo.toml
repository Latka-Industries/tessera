[package]
name = "tessera-doc"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["AHurowitz <latkaindustries@gmail.com>"]
description = "Open document format (.tes): mmap-friendly chunked binary for notes, wikis, manuscripts, and slides — AI-friendly text exports, tes CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latka-Industries/tessera"
readme = "README.md"
keywords = ["document-format", "binary-format", "notes", "markdown", "citation"]
categories = [
    "encoding",
    "text-processing",
    "command-line-utilities",
    "parser-implementations",
    "data-structures",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "tes"
path = "src/bin/tes.rs"

[[bin]]
name = "tes-lsp"
path = "src/bin/tes_lsp.rs"

[dependencies]
argus-chunk = "0.1.0"
ariadnes-weave = "0.2.1"
clap = { version = "4.6.4", features = ["derive"] }
memmap2 = "0.9.11"
pulldown-cmark = "0.13.4"
scraper = "0.27.0"
rayon = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tantivy = "0.26.1"
thiserror = "2.0.18"
time = { version = "0.3.54", features = ["formatting"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
] }
tower-lsp = "0.20.0"
uuid = { version = "1.24.0", features = ["v4", "v5"] }
katex-rs = "0.2"

[patch.crates-io]
# argus-chunk = { path = "../argus-chunk" }
# Local suite sibling (tessera-suite/ariadnes-weave → LatkaIndustries). Comment to use crates.io.
ariadnes-weave = { path = "../ariadnes-weave" }

[dev-dependencies]
anyhow = "1.0.104"
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4", "v5"] }

[[bench]]
name = "open_format"
harness = false

# Default release uses unwind so embedders can catch_unwind on malformed files
# (THI-297). Ship the `tes` / `tes-lsp` CLIs with abort via:
#   cargo build --profile release-cli --bins
[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = true

[profile.release-cli]
inherits = "release"
panic = "abort"
