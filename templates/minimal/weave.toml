# Sparse native layout overlay for ariadnes-weave (D23).
# Merged onto LayoutKnobs::bundled(); CSS themes remain Chromium-only.
#
# Convenience prose sections may sit at the root ([quote], [text], [cite], …)
# or under [prose.*]. Other categories use [table.*] / [deck.*] / [math.*] / [page.*].
# Page chrome knobs: see fixtures/packs/page_chrome/weave.toml + weave defaults/page.toml.

[quote]
# Distinct from bundled indent (18) so pack overlay is easy to spot in tests.
indent = 28.0
italic = true

# Category default pin (fonts.toml `test`) — headings without Tessprek \font wraps.
[heading]
font = "test"
