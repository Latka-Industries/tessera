# Pack-pinned fonts for native PDF (`EmitOptions::pinned_faces`, D23 / THI-356).
# Tessprek: `\font{id}{text}` seals to InlineKind::Font.
# Paths below share the stand-in TTF until dogfood packs ship real faces.

[fonts]
test = "fonts/test-face.ttf"
armenian = "fonts/test-face.ttf"
greek = "fonts/test-face.ttf"
cyrillic = "fonts/test-face.ttf"
hebrew = "fonts/test-face.ttf"
arabic = "fonts/test-face.ttf"
cjk = "fonts/test-face.ttf"
