[tools]
rust = "1.95"
uv = "latest"

[tasks.fixtures]
description = "Regenerate v0 goldens, vault sample, sync conformance accept/rejects, smoke kit"
run = """
cargo run --example gen_v0_fixtures
cp fixtures/v0/*.tes fixtures/conformance/accept/
cargo run --example gen_conformance_rejects
uv run scripts/gen_structural_rejects.py
cargo run --example gen_vault_fixtures
cargo run --example gen_sample_fixtures
bash scripts/manual-layout-v1-smoke.sh
"""

[tasks.samples]
description = "Regenerate browse .tes samples under fixtures/samples"
run = "cargo run --example gen_sample_fixtures"

[tasks.merge-smoke]
description = "Smoke tes merge-file CLI + git merge=tessera driver"
run = "bash scripts/merge-file-smoke.sh"

[tasks.bench]
description = "Claim-backed open_format Criterion benches (THI-200)"
run = "cargo bench -p tessera-doc --bench open_format"

[tasks.tes-lsp]
description = "Build tes-lsp debug binary"
run = "cargo build --bin tes-lsp"

[tasks.lsp-smoke]
description = "Stdio smoke for tes-lsp (handshake, open, change, diagnostics)"
depends = ["tes-lsp"]
run = "uv run scripts/lsp_smoke.py"

[tasks.fuzz-build]
description = "Build cargo-fuzz verify_bytes target (THI-296; needs nightly)"
run = "cargo +nightly fuzz build verify_bytes"

[tasks.fuzz]
description = "Run cargo-fuzz verify_bytes (THI-296; needs nightly)"
run = "cargo +nightly fuzz run verify_bytes"

[tasks.fuzz-clean]
description = "Remove mutated fuzz corpus + crash artifacts; keep *.tes seeds"
run = """
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$root"
removed=0
if [[ -d fuzz/corpus ]]; then
  while IFS= read -r -d '' f; do
    rm -f "$f"
    removed=$((removed + 1))
  done < <(find fuzz/corpus -type f ! -name '*.tes' -print0 2>/dev/null)
fi
rm -rf fuzz/artifacts
echo "fuzz-clean: removed $removed mutated corpus file(s); artifacts wiped; *.tes seeds kept"
"""

[tasks.fuzz-reseed]
description = "Refresh fuzz corpus *.tes seeds from conformance fixtures"
run = """
#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$root"
mkdir -p fuzz/corpus/verify_bytes
cp fixtures/conformance/accept/*.tes fuzz/corpus/verify_bytes/
cp fixtures/conformance/reject/*.tes fuzz/corpus/verify_bytes/
echo "fuzz-reseed: $(ls fuzz/corpus/verify_bytes/*.tes | wc -l) seed(s) in fuzz/corpus/verify_bytes/"
"""

# Project override of the global `check` task: same fmt/clippy/test, plus LSP smokes.
[tasks.check]
description = "fmt + clippy (-D warnings) + test + lsp-smoke"
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo fmt --all
cargo clippy -- -D warnings
cargo test
"""
