# THI-391: same chrome, justified body in column bands.
# Pair with fixtures/samples/article_columns.tes

[paragraph]
text_align = "justify"

[body_columns]
gap = 16.0

[page.header]
enabled = true
format = "{title}"
align = "left"
font_size = 9.0
y_margin_factor = 0.55

[page.footer]
enabled = true
format = "{page} / {pages}"
align = "center"
font_size = 9.0
y_margin_factor = 0.45

[page.content]
top_clearance = 18.0
bottom_clearance = 18.0
