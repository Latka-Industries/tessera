# THI-392: header center `{title}`.
# Tokens: {page}, {pages}, {title} ({heading} deferred)

[page.header]
enabled = true
format = "{title}"
align = "center"
font_size = 9.0
y_margin_factor = 0.55

[page.footer]
enabled = true
format = "{page} / {pages}"
align = "center"
font_size = 9.0
y_margin_factor = 0.45

[page.content]
top_clearance = 18.0
bottom_clearance = 18.0
