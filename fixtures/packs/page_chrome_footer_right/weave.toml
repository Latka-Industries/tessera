# THI-392: footer right, header left, n/m.
# Tokens: {page}, {pages}, {title} ({heading} deferred)

[page.header]
enabled = true
format = "{title}"
align = "left"
font_size = 9.0
y_margin_factor = 0.55

[page.footer]
enabled = true
format = "{page} / {pages}"
align = "right"
font_size = 9.0
y_margin_factor = 0.45

[page.content]
top_clearance = 18.0
bottom_clearance = 18.0
